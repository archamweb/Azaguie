<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demandes de décaissement — SIYO Azaguié</title>
<style>
:root{
  --bleu:#1a3a5c; --bleu2:#2c5f8a; --gris:#f4f5f7; --bord:#d8dce2;
  --ok:#1e7e34; --rouge:#b02a37;
  --f-peche:#FCE4D6; --f-gris:#D9D9D9; --f-bleuclair:#B4C6E7; --f-bleu:#0000CC;
  --t-bleu:#0000CC; --t-bleu2:#0070C0; --t-rouge:#C00000; --t-marine:#002060;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;font-size:14px;color:#1c2430;background:var(--gris)}
header{background:var(--bleu);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:600}
header .sub{font-size:12px;opacity:.8}
nav{background:#fff;border-bottom:2px solid var(--bord);display:flex;gap:2px;padding:0 12px;flex-wrap:wrap}
nav button{border:none;background:none;padding:11px 14px;font-size:13.5px;cursor:pointer;border-bottom:3px solid transparent;color:#334}
nav button.actif{border-bottom-color:var(--bleu2);font-weight:600;color:var(--bleu)}
nav button:hover{background:var(--gris)}
main{padding:16px;max-width:1200px;margin:0 auto}
.btn{display:inline-block;border:1px solid var(--bord);background:#fff;border-radius:6px;padding:7px 13px;font-size:13px;cursor:pointer;color:#1c2430}
.btn:hover{background:var(--gris)}
.btn.prim{background:var(--bleu2);border-color:var(--bleu2);color:#fff}
.btn.prim:hover{background:var(--bleu)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.warn{background:#8a6d1a;border-color:#8a6d1a;color:#fff}
.btn.dngr{color:var(--rouge);border-color:#e4b6bc}
.btn.sm{padding:4px 9px;font-size:12px}
table.liste{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--bord)}
table.liste th{background:#eef1f5;text-align:left;padding:8px 9px;font-size:12.5px;border-bottom:2px solid var(--bord);cursor:pointer;white-space:nowrap}
table.liste td{padding:8px 9px;border-bottom:1px solid #edf0f3;vertical-align:top}
table.liste tr:hover td{background:#f7f9fb}
.badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11.5px;font-weight:600}
.b-attente{background:#fff3cd;color:#8a6d1a}
.b-validee{background:#cfe2ff;color:#1a4a8a}
.b-archivee{background:#d7e8d9;color:#1e5e2a}
.b-unique{background:#e8e6f5;color:#4a3f8a}
.b-progressive{background:#fde2cf;color:#8a4a1a}
.mont{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.filtres{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap;align-items:center}
.filtres input,.filtres select{padding:7px 9px;border:1px solid var(--bord);border-radius:6px;font-size:13px;background:#fff}
.filtres input[type=text]{min-width:220px}
.carte{background:#fff;border:1px solid var(--bord);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.grille-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--bord);border-radius:8px;padding:12px 14px}
.stat .lbl{font-size:12px;color:#667}
.stat .val{font-size:20px;font-weight:700;margin-top:3px}
.stat .det{font-size:12px;color:#667;margin-top:2px}
h2{font-size:16px;margin:4px 0 12px}
h3{font-size:14px;margin:14px 0 8px}
.note{font-size:12px;color:#667;font-style:italic}
.alerte-stockage{background:#fff3cd;border:1px solid #e6d9a8;padding:8px 12px;border-radius:6px;margin-bottom:12px;font-size:12.5px}
.form-grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px 14px}
.champ{display:flex;flex-direction:column;gap:4px}
.champ label{font-size:12px;font-weight:600;color:#445}
.champ input,.champ select,.champ textarea{padding:7px 9px;border:1px solid var(--bord);border-radius:6px;font-size:13.5px;font-family:inherit}
.champ input:focus,.champ select:focus{outline:2px solid #bcd4ea}
table.lignes{width:100%;border-collapse:collapse;margin-top:6px}
table.lignes th{background:#eef1f5;padding:6px 8px;font-size:12px;text-align:left}
table.lignes td{padding:3px 4px}
table.lignes input{width:100%;padding:6px 8px;border:1px solid var(--bord);border-radius:5px;font-size:13px}
table.lignes .tot{text-align:right;font-weight:600;padding-right:8px;white-space:nowrap}
.voile{position:fixed;inset:0;background:rgba(20,30,45,.45);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px;z-index:50}
.voile.ouvert{display:flex}
.modale{background:#fff;border-radius:10px;max-width:920px;width:100%;padding:18px 22px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.modale h2{margin-top:0}
.modale .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;align-items:center}
/* ---------- FICHE OFFICIELLE (modèle validé DOC-REA-001) ---------- */
#zone-fiche{display:none}
.fiche{background:#fff;width:210mm;min-height:276mm;margin:0 auto;padding:8mm 10mm 6mm;border:1px solid var(--bord);
  font-family:Cambria,Georgia,serif;font-size:12.5px;color:#000;display:flex;flex-direction:column;position:relative}
.fiche, .fiche *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
.fiche .sig-cadre{border:1px solid #000;margin-top:14px;padding:8px 6px 0}
.fiche .cartouche{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.fiche .cartouche img{height:58px}
.fiche .cartouche .titre{flex:1;text-align:center;font-weight:700;font-size:15px;padding-top:22px}
.fiche .cartouche .doc{font-size:10.5px;text-align:right;white-space:nowrap;line-height:1.5}
.fiche table.corps{width:100%;border-collapse:collapse}
.fiche table.corps td,.fiche table.corps th{border:1px solid #000;padding:5px 8px;font-size:12.5px;vertical-align:middle}
.fiche .bande-projet{background:var(--f-peche);font-weight:700;text-align:center;font-size:13px;white-space:pre-line}
.fiche td.lbl{font-weight:700;width:38%}
.fiche td.val-bleu{color:var(--t-bleu);font-weight:700;text-align:center}
.fiche td.centre{text-align:center}
.fiche td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.fiche th.col{font-weight:700;text-align:center}
.fiche tr.ligne-bleue td{color:var(--t-bleu2)}
.fiche tr.ligne-grise td{background:var(--f-gris)}
.fiche tr.tot-bleu td{color:var(--t-bleu);font-weight:700}
.fiche tr.tot-gris td{background:var(--f-gris);font-weight:700}
.fiche tr.tot-rouge td{color:var(--t-rouge);font-weight:700}
.fiche tr.r-espece td{background:var(--f-peche);font-weight:700}
.fiche tr.r-cheque td{background:var(--f-bleuclair);font-weight:700}
.fiche tr.r-virement td{background:var(--f-gris);font-weight:700}
.fiche tr.r-total td{background:var(--f-bleu);color:#fff;font-weight:700}
.fiche .sigs{display:flex;justify-content:space-between;font-weight:700;font-size:12.5px;gap:10px;color:#000}
.fiche .sigs div{flex:1;text-align:center;min-height:160px}
.fiche .espace{flex:1}
.fiche .pied{display:flex;justify-content:space-between;border-top:1px solid #000;padding-top:4px;font-size:10px;color:#222;margin-top:14px}
@media print{
  body{background:#fff}
  body.mode-impression header, body.mode-impression nav, body.mode-impression main, body.mode-impression .voile{display:none !important}
  body.mode-impression #zone-fiche{display:block !important}
  .fiche{border:none;width:auto;min-height:274mm;height:274mm;padding:0;page-break-inside:avoid;overflow:hidden}
  @page{size:A4 portrait;margin:10mm 8mm}
}
</style>
</head>
<body>
<header>
  <div>
    <h1>Demandes de décaissement — SIYO</h1>
    <div class="sub" id="entete-projet">Dispersion Azaguié</div>
  </div>
  <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <span id="etat-sync" style="font-size:12px;font-weight:600"></span>
    <button class="btn" onclick="synchroniser()" title="Envoyer les modifications en attente et recharger depuis le Google Sheet">🔄 Synchroniser</button>
    <button class="btn prim" onclick="ouvrirNouvelle()">+ Nouvelle demande</button>
    <button class="btn" onclick="exporterJSON()">💾 Enregistrer (JSON)</button>
    <label class="btn" style="cursor:pointer">📂 Charger<input type="file" accept=".json" style="display:none" onchange="importerJSON(this)"></label>
  </div>
</header>
<nav id="onglets">
  <button data-vue="bord" class="actif" onclick="voir('bord')">Tableau de bord</button>
  <button data-vue="encours" onclick="voir('encours')">Demandes en cours</button>
  <button data-vue="archives" onclick="voir('archives')">Archives</button>
  <button data-vue="decaissements" onclick="voir('decaissements')">Décaissements</button>
  <button data-vue="acteurs" onclick="voir('acteurs')">Acteurs</button>
  <button data-vue="imputations" onclick="voir('imputations')">Imputations</button>
  <button data-vue="params" onclick="voir('params')">Paramètres</button>
</nav>
<main id="contenu"></main>

<div class="voile" id="voile"><div class="modale" id="modale"></div></div>
<div id="zone-fiche"></div>

  }

}

}
function sauver(d, type){
  sauverLocal();
  if(typeof CONNEX==="undefined" || !CONNEX){ if(typeof majEtatSync==="function") majEtatSync(); return; }
  if(type==="params" || (!d && !type)) pushOp({type:"params", id:"params"});
  else if(type==="all") pushOp({type:"all", id:"all"});
  else if(d) pushOp({type:"demande", id:d.id});
}

   OUTILS
   ============================================================ */
const F = n => (n==null||isNaN(n)) ? "—" : Math.round(n).toLocaleString("fr-FR").replace(/ /g," ");
const FC = n => F(n)+" CFA";
const DT = s => { if(!s) return "—"; const [a,m,j]=s.split("-"); return `${j}/${m}/${a}`; };
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const auj = () => new Date().toISOString().slice(0,10);
function meta(k, defaut){ return (ETAT.meta && ETAT.meta[k]!=null) ? ETAT.meta[k] : defaut; }
function poste(code){ const p = ETAT.postes.find(p=>p.code===code); return p ? p.libelle : "⚠ code inconnu"; }
function totalLignes(d){ return (d.lignes||[]).reduce((s,l)=>s + (Number(l.pu)||0)*(Number(l.qte)||0), 0); }
function totalReceptionne(d){ return (d.receptions||[]).reduce((s,l)=>s + (Number(l.pu)||0)*(Number(l.qte)||0), 0); }
function totalPaye(d){ return (d.reglements||[]).reduce((s,r)=>s + (Number(r.montant)||0), 0); }
function baseRetenue(d){ return (d.receptions||[]).filter(l=>l.ret!==false).reduce((s,l)=>s + (Number(l.pu)||0)*(Number(l.qte)||0), 0); }
function retenue(d){ return baseRetenue(d) * (Number(d.retenuePct)||0)/100; }
function ord(n){ return n===1 ? "1er" : n+"ème"; }
function resteAPayer(d){ return totalReceptionne(d) - totalPaye(d) - retenue(d) + (Number(d.retenueRestituee)||0); }
function montantDemande(d){ return d.nature==="unique" ? totalLignes(d) : Math.max(0, Math.round(resteAPayer(d))); }
function delaiJours(d){
  if(!d.reglements||!d.reglements.length) return null;
  const dern = d.reglements[d.reglements.length-1].date;
  const j = Math.round((new Date(dern) - new Date(d.dateCreation))/86400000);
  return j < 0 ? null : j;   // négatif = demande reconfigurée après paiement : non significatif
}
function parId(id){ return ETAT.demandes.find(d=>d.id===id); }
function telecharger(nom, contenu, type){
  const b = new Blob([contenu], {type});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = nom; a.click();
  URL.revokeObjectURL(a.href);
}

function exporterJSON(){

function importerJSON(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const nouv = JSON.parse(r.result);
      if(!nouv.demandes || !nouv.postes) throw new Error("structure");
      ETAT = nouv; sauver(null,"all"); voir(vueActive);
      alert(`Chargé : ${nouv.demandes.length} demandes.`);
    }catch(e){ alert("Fichier invalide — ce n'est pas une sauvegarde de l'appli."); }
  };
  r.readAsText(f); input.value = "";
}
function exporterCSV(){
  const sep = ";";
  let out = "Type"+sep+"N° demande"+sep+"Nature"+sep+"Objet"+sep+"Acteur"+sep+"Imputation"+sep+"Poste"+sep+"Affectation"+sep+"Statut"+sep+"Date création"+sep+"Montant demandé"+sep+"Date règlement"+sep+"Montant réglé"+sep+"Mode"+sep+"Réf. tranche"+sep+"Observation\n";
  const q = s => '"'+String(s??"").replace(/"/g,'""')+'"';
  for(const d of ETAT.demandes){
    out += ["DEMANDE",d.num,d.nature,q(d.objet),q(d.beneficiaire),d.imputation,q(poste(d.imputation)),q(d.axe),d.statut,d.dateCreation,Math.round(montantDemande(d)),"","","","",q(d.obs||"")].join(sep)+"\n";
    for(const r of (d.reglements||[])){
      out += ["REGLEMENT",d.num,d.nature,q(d.objet),q(d.beneficiaire),d.imputation,q(poste(d.imputation)),q(d.axe),"","","",r.date,Math.round(r.montant),r.mode,q(r.ref||""),q(r.obs||"")].join(sep)+"\n";
    }
  }
  telecharger(`registre-demandes-azaguie-${auj()}.csv`, "﻿"+out, "text/csv;charset=utf-8");
}

  return stockageOK ? "" :

}
function vueBord(){
  const ds = ETAT.demandes;
  const att = ds.filter(d=>d.statut==="attente"), val = ds.filter(d=>d.statut==="validee");
  const totAtt = att.reduce((s,d)=>s+montantDemande(d),0), totVal = val.reduce((s,d)=>s+montantDemande(d),0);
  const totDec = ds.reduce((s,d)=>s+totalPaye(d),0);
  const parMode = {};
  ds.forEach(d=>(d.reglements||[]).forEach(r=>{ parMode[r.mode]=(parMode[r.mode]||0)+Number(r.montant||0); }));
  const delais = ds.map(delaiJours).filter(x=>x!=null);
  const delaiMoy = delais.length ? Math.round(delais.reduce((a,b)=>a+b,0)/delais.length) : null;
  const resteProg = ds.filter(d=>d.nature==="progressive").reduce((s,d)=>s+Math.max(0,resteAPayer(d)),0);
  return bandeauStockage()+`
  <h2>Tableau de bord</h2>
  <div class="grille-stats">
    <div class="stat"><div class="lbl">En attente de validation</div><div class="val">${att.length}</div><div class="det">${F(totAtt)} FCFA demandés</div></div>
    <div class="stat"><div class="lbl">Validées, à décaisser</div><div class="val">${val.length}</div><div class="det">${F(totVal)} FCFA à décaisser</div></div>
    <div class="stat"><div class="lbl">Total décaissé</div><div class="val">${F(totDec)}</div><div class="det">${Object.entries(parMode).map(([m,v])=>`${m} : ${F(v)}`).join(" · ")||"—"}</div></div>
    <div class="stat"><div class="lbl">Reste à solder (progressives)</div><div class="val">${F(resteProg)}</div><div class="det">travaux réceptionnés non payés</div></div>
    <div class="stat"><div class="lbl">Délai moyen création → décaissement</div><div class="val">${delaiMoy==null?"—":delaiMoy+" j"}</div><div class="det">sur ${delais.length} demande(s) décaissée(s)</div></div>
    <div class="stat"><div class="lbl">Demandes au total</div><div class="val">${ds.length}</div><div class="det">${ds.filter(d=>d.nature==="progressive").length} progressives · ${ds.filter(d=>d.nature==="unique").length} uniques</div></div>
  </div>
  <div class="carte"><h3 style="margin-top:0">Rappels du système</h3>
    <div class="note">• Une demande <b>unique</b> se décaisse une fois puis part aux archives (bouton « Dupliquer » pour les récurrentes : primes, caisse…).<br>
    • Une demande <b>progressive</b> (acteur au métré) se réactualise depuis les archives : nouvelles réceptions → nouvelle demande → décaissement → retour aux archives.<br>
    • Les imputations sont la copie exacte des 78 postes du budget V03 (+ IMPREVU) : l'export CSV se recopie dans le registre du V03 sans re-saisie.<br>
    • Export hebdomadaire recommandé : bouton <b>💾 Enregistrer (JSON)</b>, à ranger dans le dossier projet.</div>
  </div>`;
}
function lgnDemande(d){
  const badgeS = {attente:'<span class="badge b-attente">En attente</span>', validee:'<span class="badge b-validee">Validée</span>', archivee:'<span class="badge b-archivee">Archivée</span>'}[d.statut];
  const badgeN = d.nature==="progressive" ? '<span class="badge b-progressive">Progressive</span>' : '<span class="badge b-unique">Unique</span>';
  let actions = `<button class="btn sm" onclick="ouvrirFiche(${d.id})">Fiche / Imprimer</button> <button class="btn sm" onclick="ouvrirEdition(${d.id})">Modifier</button>`;
  if(d.statut==="attente") actions += ` <button class="btn sm prim" onclick="valider(${d.id})">Marquer validée</button>`;
  if(d.statut==="validee") actions += ` <button class="btn sm ok" onclick="ouvrirDecaissement(${d.id})">Décaisser</button>`;
  if(d.statut==="archivee" && d.nature==="progressive") actions += ` <button class="btn sm warn" onclick="ouvrirActualisation(${d.id})">Actualiser</button>`;
  if(d.statut==="archivee" && d.nature==="unique") actions += ` <button class="btn sm" onclick="dupliquer(${d.id})">Dupliquer</button>`;
  actions += ` <button class="btn sm dngr" onclick="supprimer(${d.id})">✕</button>`;
  const mnt = d.statut==="archivee" ? totalPaye(d) : montantDemande(d);
  return `<tr>
    <td><b>${d.num}</b><br>${badgeN}</td>
    <td>${esc(d.objet)}<br><span class="note">${esc(d.beneficiaire)}</span></td>
    <td>${d.imputation}<br><span class="note">${esc(poste(d.imputation))}</span></td>
    <td>${esc(d.axe)}</td>

    <td style="white-space:nowrap">${actions}</td></tr>`;
}
function vueListe(statuts, titre){
  let ds = ETAT.demandes.filter(d=>statuts.includes(d.statut));

  if(filtre.nature) ds = ds.filter(d=>d.nature===filtre.nature);
  if(filtre.imputation) ds = ds.filter(d=>d.imputation===filtre.imputation);
  const cle = {num:d=>d.num, date:d=>d.dateCreation, montant:d=>montantDemande(d), benef:d=>d.beneficiaire, imput:d=>d.imputation};
  const k = cle[filtre.tri]||cle.num;
  ds.sort((a,b)=>{ const x=k(a), y=k(b); return (x<y?-1:x>y?1:0)*filtre.sens; });
  const imputsUtiles = [...new Set(ETAT.demandes.map(d=>d.imputation))].sort();

  <p class="note" style="margin-top:8px">Mêmes colonnes que la feuille « Décaissements » du budget V03 — l'export .xlsx reproduit exactement ce tableau, prêt à coller à partir de la ligne 7.</p>`;
}
function vueActeurs(){
  const fq = n => (n==null||isNaN(n)) ? "—" : Number(n).toLocaleString("fr-FR",{maximumFractionDigits:2}).replace(/ /g," ");
  const presta = d => (d.nature==="progressive" ? (d.bc && d.bc.designation) : "") || d.objet || "—";
  const unite  = d => d.nature==="progressive" ? (((d.receptions&&d.receptions[0]&&d.receptions[0].unite) || (d.bc&&d.bc.unite))||"") : ((d.lignes&&d.lignes.length===1)?d.lignes[0].unite:"");
  const qcum   = d => d.nature==="progressive" ? (d.receptions||[]).reduce((s,l)=>s+(Number(l.qte)||0),0) : null;
  const recu   = d => d.nature==="progressive" ? totalReceptionne(d) : totalLignes(d);
  const rst    = d => d.nature==="progressive" ? resteAPayer(d) : (totalLignes(d)-totalPaye(d));
  const retn   = d => d.nature==="progressive" ? (retenue(d)-(Number(d.retenueRestituee)||0)) : 0;

  // --- Prestataires externes (Interne = non) : 1 ligne par acteur × prestation
  const extMap = {};
  ETAT.demandes.filter(d=>!d.interne).forEach(d=>{
    const u=unite(d), p=presta(d), k=(d.beneficiaire||"—")+"||"+p+"||"+u;
    const g = extMap[k] || (extMap[k]={acteur:d.beneficiaire||"—", presta:p, unite:u, qte:0, qteVide:true, recu:0, paye:0, ret:0, reste:0});
    const q=qcum(d); if(q!=null){ g.qte+=q; g.qteVide=false; }
    g.recu+=recu(d); g.paye+=totalPaye(d); g.ret+=retn(d); g.reste+=rst(d);
  });
  const ext = Object.values(extMap).sort((a,b)=> a.acteur===b.acteur ? a.presta.localeCompare(b.presta) : a.acteur.localeCompare(b.acteur));
  const sExt = ext.reduce((s,g)=>({recu:s.recu+g.recu, paye:s.paye+g.paye, ret:s.ret+g.ret, reste:s.reste+g.reste}), {recu:0,paye:0,ret:0,reste:0});

  // --- Dépenses internes SIYO (Interne = oui) : regroupées par prestation, sous le nom « SIYO »
  const intMap = {};
  ETAT.demandes.filter(d=>d.interne).forEach(d=>{
    const p=presta(d), g=intMap[p]||(intMap[p]={presta:p, recu:0, paye:0, reste:0});
    g.recu+=recu(d); g.paye+=totalPaye(d); g.reste+=rst(d);
  });
  const inter = Object.values(intMap).sort((a,b)=>a.presta.localeCompare(b.presta));
  const sInt = inter.reduce((s,g)=>({recu:s.recu+g.recu, paye:s.paye+g.paye, reste:s.reste+g.reste}), {recu:0,paye:0,reste:0});

  const styR = v => v>0.5 ? 'color:var(--rouge);font-weight:700' : '';
  const qteAff = g => g.qteVide ? "—" : (g.unite==="%" ? fq(g.qte*100) : fq(g.qte));

  return `<h2>Point des acteurs</h2>
  <p class="note">Le travail réalisé d'abord, puis les montants. Séparation Externes / Interne SIYO selon le réglage « Interne / Externe » de chaque demande.
  « Reste à solder » = réceptionné − payé − retenue + retenue restituée. Un reste négatif = avance versée non encore couverte par des travaux.</p>
  <table class="liste"><thead><tr>
    <th>Acteur</th><th>Prestation</th><th>Unité</th><th style="text-align:right">Quantité (cumul)</th>
    <th style="text-align:right">Réceptionné</th><th style="text-align:right">Payé</th>
    <th style="text-align:right">Retenue</th><th style="text-align:right">Reste à solder</th>
  </tr></thead><tbody>
    <tr><td colspan="8" style="background:#eef1f5;font-weight:700;color:var(--bleu)">PRESTATAIRES EXTERNES</td></tr>
    ${ext.length ? ext.map(g=>`<tr>
      <td><b>${esc(g.acteur)}</b></td><td>${esc(g.presta)}</td><td>${esc(g.unite)||"—"}</td>
      <td class="mont">${qteAff(g)}</td><td class="mont">${F(g.recu)}</td><td class="mont">${F(g.paye)}</td>
      <td class="mont">${g.ret?F(g.ret):"—"}</td>
      <td class="mont" style="${styR(g.reste)}">${F(g.reste)}</td></tr>`).join("")
      : `<tr><td colspan="8" style="color:#889;padding:12px">Aucun prestataire externe.</td></tr>`}
    <tr style="background:#f4f6f8;font-weight:700">
      <td colspan="4">Sous-total prestataires externes</td>
      <td class="mont">${F(sExt.recu)}</td><td class="mont">${F(sExt.paye)}</td>
      <td class="mont">${sExt.ret?F(sExt.ret):"—"}</td>
      <td class="mont" style="${styR(sExt.reste)}">${F(sExt.reste)}</td></tr>

    <tr><td colspan="8" style="background:#eef1f5;font-weight:700;color:var(--bleu)">DÉPENSES INTERNES SIYO</td></tr>
    ${inter.length ? inter.map(g=>`<tr>
      <td><b>SIYO</b></td><td>${esc(g.presta)}</td><td>—</td><td class="mont">—</td>
      <td class="mont">${F(g.recu)}</td><td class="mont">${F(g.paye)}</td><td class="mont">—</td>
      <td class="mont" style="${styR(g.reste)}">${F(g.reste)}</td></tr>`).join("")
      : `<tr><td colspan="8" style="color:#889;padding:12px">Aucune dépense interne.</td></tr>`}
    <tr style="background:#f4f6f8;font-weight:700">
      <td colspan="4">Sous-total dépenses SIYO (interne)</td>
      <td class="mont">${F(sInt.recu)}</td><td class="mont">${F(sInt.paye)}</td>
      <td class="mont">—</td><td class="mont" style="${styR(sInt.reste)}">${F(sInt.reste)}</td></tr>
  </tbody></table>`;
}
function vueImputations(){
  const grp = {};
  for(const d of ETAT.demandes){
    const c = d.imputation;
    grp[c] = grp[c] || {paye:0, attente:0, n:0};
    grp[c].n++;
    grp[c].paye += totalPaye(d);
    if(d.statut!=="archivee") grp[c].attente += montantDemande(d);
  }
  const codes = Object.keys(grp).sort();
  const totP = codes.reduce((s,c)=>s+grp[c].paye,0), totA = codes.reduce((s,c)=>s+grp[c].attente,0);
  return `<h2>Totaux par imputation budgétaire</h2>
  <p class="note">Copie exacte des codes du budget V03 — à rapprocher de la colonne « Total dépense » du V03 (le budget Excel reste la référence).</p>
  <table class="liste"><thead><tr><th>Code</th><th>Poste</th><th style="text-align:right">Demandes</th>
  <th style="text-align:right">Décaissé</th><th style="text-align:right">En cours (non décaissé)</th></tr></thead><tbody>
  ${codes.map(c=>`<tr><td><b>${c}</b></td><td>${esc(poste(c))}</td><td class="mont">${grp[c].n}</td>
    <td class="mont">${F(grp[c].paye)}</td><td class="mont">${F(grp[c].attente)}</td></tr>`).join("")}
  <tr style="font-weight:700;background:#f4f6f8"><td></td><td>TOTAL</td><td></td><td class="mont">${F(totP)}</td><td class="mont">${F(totA)}</td></tr>
  </tbody></table>`;
}

function sauverParams(){
  ETAT.meta.docTitre = document.getElementById("p-titre").value;

  ETAT.meta.piedCentre = document.getElementById("p-piedc").value;
  ETAT.meta.entete = document.getElementById("p-entete").value;
  ETAT.meta.retenueDefaut = Number(document.getElementById("p-retenue").value)||0;

function enregistrerDemande(id){
  const g = x => document.getElementById(x).value;
  const nature = g("f-nature");
  if(!g("f-objet").trim()){ alert("L'objet de la demande est obligatoire."); return; }
  if(!g("f-benef").trim()){ alert("L'acteur est obligatoire."); return; }
  let d;
  if(id==null){
    const num = `D-${ETAT.meta.annee}-${String(ETAT.meta.prochainNum).padStart(3,"0")}`;
    ETAT.meta.prochainNum++;
    d = {id:Date.now(), num, nature, reglements:[], statut:"attente", retenueRestituee:0};
    ETAT.demandes.push(d);
  } else { d = parId(id); }
  d.dateCreation = g("f-date"); d.objet = g("f-objet").trim(); d.beneficiaire = g("f-benef").trim();
  d.imputation = g("f-imput"); d.axe = g("f-axe"); d.modePrevu = g("f-mode");
  d.duree = g("f-duree").trim();
  d.interne = g("f-interne")==="1"; d.obs = g("f-obs");
  if(id!=null){
    d.reglements = regEditTmp.filter(r=>Number(r.montant))
      .map(r=>({date:r.date, montant:Number(r.montant)||0, mode:r.mode||"Espèces", ref:(r.ref||"").trim(), obs:(r.obs||"").trim()}));
  }
  if(nature==="unique"){
    d.lignes = lignesTmp.filter(l=>l.designation||l.pu||l.qte).map(l=>({designation:l.designation,unite:l.unite,pu:Number(l.pu)||0,qte:Number(l.qte)||0}));
    if(!d.lignes.length){ alert("Ajoute au moins une ligne."); return; }
  } else {
    d.bc = {designation:g("f-bc-des"), unite:g("f-bc-unite"), pu:Number(g("f-bc-pu"))||0, qte:Number(g("f-bc-qte"))||0};
    d.retenuePct = Number(g("f-retenue"))||0;
    d.retenueLbl = g("f-ret-lbl").trim();
    d.receptions = recEditTmp.filter(l=>l.designation||Number(l.pu)||Number(l.qte))
      .map(l=>({date:l.date,designation:l.designation,unite:l.unite,pu:Number(l.pu)||0,qte:Number(l.qte)||0,ret:l.ret!==false}));
  }
  sauver(d); fermerModale(); voir(vueActive==="bord"?"encours":vueActive);
}
function valider(id){
  const d = parId(id);
  d.statut = "validee"; d.dateValidation = auj();
  sauver(d); voir(vueActive);
}
function supprimer(id){
  const d = parId(id);
  if(confirm(`Supprimer définitivement ${d.num} — ${d.objet} ?`)){
    ETAT.demandes = ETAT.demandes.filter(x=>x.id!==id); sauverLocal(); if(typeof CONNEX!=="undefined" && CONNEX) pushOp({type:"delete", id:id}); voir(vueActive);
  }
}
function dupliquer(id){
  const s = parId(id);
  const num = `D-${ETAT.meta.annee}-${String(ETAT.meta.prochainNum).padStart(3,"0")}`;
  ETAT.meta.prochainNum++;

let actId = null;
function majActMnt(){
  const el = document.getElementById("act-mnt");
  if(!el || actId==null) return;
  const dd = parId(actId);
  const tot = recTmp.reduce((s,l)=>s+(Number(l.pu)||0)*(Number(l.qte)||0),0);
  const totRet = recTmp.filter(l=>l.ret!==false).reduce((s,l)=>s+(Number(l.pu)||0)*(Number(l.qte)||0),0);
  const restit = Number(document.getElementById("act-restit")?.value)||0;
  el.value = F(Math.max(0, Math.round(tot - totalPaye(dd) - totRet*(Number(dd.retenuePct)||0)/100 + restit)))+" FCFA";
}

  const tb = document.querySelector("#t-rec tbody"); if(!tb) return;

  document.querySelectorAll("#t-rec tbody .tot").forEach((td,i)=>{ td.textContent = F((Number(recTmp[i].pu)||0)*(Number(recTmp[i].qte)||0)); });

function confirmerActualisation(id){
  const d = parId(id);
  d.receptions = recTmp.filter(l=>(Number(l.pu)||0)*(Number(l.qte)||0)>0 || l.designation)

}

function rendreFiche(d){

  let lignesCorps = "";

      <td></td><td></td><td></td><td class="n">-${F(r.montant)}</td><td></td></tr>`).join("");
  if(d.nature==="unique"){
    lignesCorps = (d.lignes||[]).map((l,i)=>`<tr class="ligne-bleue"><td class="centre">${i+1}</td><td>${esc(l.designation)}</td>
      <td class="centre">${esc(l.unite)}</td><td class="n">${F(l.pu)}</td><td class="n">${F(l.qte)}</td><td class="n">${F(l.pu*l.qte)}</td><td></td></tr>`).join("");
    lignesCorps += regls;
    lignesCorps += `<tr class="tot-bleu"><td class="centre">1</td><td colspan="4">Total de la demande</td><td></td><td class="n">${F(totalLignes(d))}</td></tr>`;
    if((d.reglements||[]).length){
      lignesCorps += `<tr class="tot-gris"><td class="centre">2</td><td colspan="4">Total soldé à ce jour</td><td></td><td class="n">-${F(totalPaye(d))}</td></tr>

    }
  } else {
    /* cumul par prestation, comme le modèle 1B */

        <td class="centre">${esc(g.unite)}</td><td class="n">${F(g.pu)}</td><td class="n">${g.qte.toLocaleString("fr-FR")}</td><td class="n">${F(g.pu*g.qte)}</td><td></td></tr>`).join("");
    } else {
      lignesCorps = `<tr class="ligne-bleue"><td></td><td>Avance / acompte sur prestation</td>
        <td class="centre">${esc(d.bc?d.bc.unite:"")}</td><td class="n"></td><td class="n"></td><td class="n">${F(montantDemande(d))}</td><td></td></tr>`;
    }
    lignesCorps += regls;
    lignesCorps += `<tr class="tot-bleu"><td class="centre">1</td><td colspan="4" class="centre">Total travaux réalisés à ce jour</td><td></td><td class="n">${F(grp.length?totalReceptionne(d):montantDemande(d))}</td></tr>
    <tr class="tot-gris"><td class="centre">2</td><td colspan="4" class="centre">Total soldé à ce jour</td><td></td><td class="n">${totalPaye(d)?"-"+F(totalPaye(d)):"0"}</td></tr>`;

    lignesCorps += `<tr class="tot-rouge"><td></td><td colspan="4" class="centre">Montant dû à ce jour</td><td></td><td class="n">${F(grp.length?resteAPayer(d):montantDemande(d))}</td></tr>`;
  }
  return `<div class="fiche">
    <div class="cartouche">
      <img src="${LOGO}" alt="SIYO">
      <div class="titre">${esc(meta('docTitre','DEMANDE DE DECAISSEMENT SUR BUDGET'))}</div>
      <div class="doc">Référence : ${esc(meta('docRef','DOC-REA-001'))}<br>Revision : ${esc(meta('docRev','01'))}<br>Date création : ${esc(meta('docDate','04/01/2025'))}</div>
    </div>
    <table class="corps">
      <tr><td colspan="5" class="bande-projet">${esc(ETAT.meta.entete)}</td></tr>
      <tr><td class="lbl">Date</td><td class="centre" colspan="4" style="font-weight:700">${DT(d.dateCreation)}</td></tr>
      <tr><td class="lbl">Objet de la demande</td><td class="val-bleu" colspan="4">${esc(d.objet)}</td></tr>
      ${blocBC}
      <tr><td class="lbl">Durée prévisionnelle des travaux</td><td class="val-bleu" colspan="4">${esc(d.duree||"-")}</td></tr>
      <tr><td class="lbl">Valeur de la demande</td><td class="val-bleu" colspan="4">${F(mnt)}</td></tr>
      <tr><td class="lbl">Acteur</td><td class="centre" colspan="4" style="font-weight:700">${esc(d.beneficiaire)}</td></tr>
      <tr><td class="lbl">Imputation budgétaire</td><td class="centre" colspan="4">${esc(d.imputation)} — ${esc(poste(d.imputation))}</td></tr>
      <tr><td class="lbl">Affectation</td><td class="centre" colspan="4">${esc(d.axe)}</td></tr>
    </table>
    <table class="corps" style="margin-top:8px">
      <colgroup><col style="width:5%"><col style="width:40%"><col style="width:8%"><col style="width:10%"><col style="width:9%"><col style="width:14%"><col style="width:14%"></colgroup>
      <tr><th class="col">N°</th><th class="col">DESIGNATIONS</th><th class="col">Unité</th><th class="col">Prix U.</th><th class="col">Qté</th><th class="col" colspan="2">Frais total</th></tr>
      ${lignesCorps}
    </table>
    <table class="corps" style="margin-top:8px">
      <tr class="r-espece"><td style="width:62%">MONTANT TOTAL ESPECE</td><td class="n">${FC(modes["Espèces"])}</td></tr>
      <tr class="r-cheque"><td>MONTANT TOTAL CHEQUE</td><td class="n">${FC(modes["Chèque"])}</td></tr>
      <tr class="r-virement"><td>MONTANT TOTAL VIREMENT</td><td class="n">${FC(modes["Virement"])}</td></tr>
      <tr class="r-total"><td>MONTANT TOTAL</td><td class="n">${FC(mnt)}</td></tr>
    </table>
    ${d.obs?`<p style="font-size:11px;margin:8px 0 0"><b>Observation :</b> ${esc(d.obs)}</p>`:""}
    <div class="sig-cadre"><div class="sigs">${sigs.map(s=>`<div>${s}</div>`).join("")}</div></div>
    <div class="espace"></div>
    <div class="pied"><span>${d.num}</span><span>${esc(meta('piedCentre','BUDGET PREVISIONNEL DE PROJET- REALISATION'))}</span><span>page 1 / 1</span></div>
  </div>`;
}

/* ============================================================
   EXPORT DÉCAISSEMENTS — format budget V03 (.xlsx)
   ============================================================ */
// Générateur .xlsx minimal (zip STORE + XML), sans librairie — testable en Node et navigateur.
function _crc32(bytes){
  let c, crc = 0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++){
    c = (crc ^ bytes[i]) & 0xFF;
    for(let k=0;k<8;k++) c = c & 1 ? (c>>>1) ^ 0xEDB88320 : c>>>1;
    crc = (crc>>>8) ^ c;
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function _utf8(str){ return new TextEncoder().encode(str); }
function _num2bytes(n, len){ const a=[]; for(let i=0;i<len;i++){ a.push(n & 0xFF); n>>>=8; } return a; }
function _concat(arrs){
  let len=0; arrs.forEach(a=>len+=a.length);
  const out=new Uint8Array(len); let o=0;
  arrs.forEach(a=>{ out.set(a,o); o+=a.length; });
  return out;
}
function _zip(files){ // files: [{name, data:Uint8Array}]
  const locals=[], centrals=[]; let offset=0;
  for(const f of files){
    const name=_utf8(f.name), crc=_crc32(f.data), sz=f.data.length;
    const lh=_concat([ new Uint8Array([0x50,0x4b,0x03,0x04]),
      new Uint8Array(_num2bytes(20,2)), new Uint8Array(_num2bytes(0,2)),
      new Uint8Array(_num2bytes(0,2)), new Uint8Array(_num2bytes(0,2)), new Uint8Array(_num2bytes(0,2)),
      new Uint8Array(_num2bytes(crc,4)), new Uint8Array(_num2bytes(sz,4)), new Uint8Array(_num2bytes(sz,4)),
      new Uint8Array(_num2bytes(name.length,2)), new Uint8Array(_num2bytes(0,2)), name ]);
    locals.push(lh, f.data);
    centrals.push(_concat([ new Uint8Array([0x50,0x4b,0x01,0x02]),
      new Uint8Array(_num2bytes(20,2)), new Uint8Array(_num2bytes(20,2)),
      new Uint8Array(_num2bytes(0,2)), new Uint8Array(_num2bytes(0,2)), new Uint8Array(_num2bytes(0,2)), new Uint8Array(_num2bytes(0,2)),
      new Uint8Array(_num2bytes(crc,4)), new Uint8Array(_num2bytes(sz,4)), new Uint8Array(_num2bytes(sz,4)),
      new Uint8Array(_num2bytes(name.length,2)), new Uint8Array(_num2bytes(0,2)), new Uint8Array(_num2bytes(0,2)),
      new Uint8Array(_num2bytes(0,2)), new Uint8Array(_num2bytes(0,2)), new Uint8Array(_num2bytes(0,4)),
      new Uint8Array(_num2bytes(offset,4)), name ]));
    offset += lh.length + f.data.length;
  }
  const cd=_concat(centrals);
  const eocd=_concat([ new Uint8Array([0x50,0x4b,0x05,0x06]),
    new Uint8Array(_num2bytes(0,2)), new Uint8Array(_num2bytes(0,2)),
    new Uint8Array(_num2bytes(files.length,2)), new Uint8Array(_num2bytes(files.length,2)),
    new Uint8Array(_num2bytes(cd.length,4)), new Uint8Array(_num2bytes(offset,4)), new Uint8Array(_num2bytes(0,2)) ]);
  return _concat([_concat(locals), cd, eocd]);
}
function _esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c])); }
function _serieDate(iso){ // jours depuis 1899-12-30
  const [a,m,j]=iso.split("-").map(Number);
  const d=Date.UTC(a,m-1,j), base=Date.UTC(1899,11,30);
  return Math.round((d-base)/86400000);
}

const CT = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+

const COL = ["A","B","C","D","E","F","G","H","I"];
function _cell(ref, style, type, val){
  if(val===null||val===undefined||val==="") return `<c r="${ref}" s="${style}"/>`;
  if(type==="n") return `<c r="${ref}" s="${style}"><v>${val}</v></c>`;
  return `<c r="${ref}" s="${style}" t="inlineStr"><is><t xml:space="preserve">${_esc(val)}</t></is></c>`;
}
// lignes = [{num, designation, acteur, dateISO, montant, nature, imputation, mois, observation}]
function construireXlsx(lignes){
  let rows="";
  const merge = ["A1:I1","A2:I2","A5:I5"];
  // r1 titre
  rows += `<row r="1" ht="28" customHeight="1">`+_cell("A1",1,"s","RÉCAPITULATIF DE TOUS LES DÉCAISSEMENTS");
  for(let i=1;i<9;i++) rows += `<c r="${COL[i]}1" s="1"/>`; rows += `</row>`;
  // r2 sous-titre
  rows += `<row r="2">`+_cell("A2",2,"s","PROJET DE RENFORCEMENT DE L'ALIMENTATION EN EAU POTABLE DE LA VILLE D'ABIDJAN — DISTRIBUTION AZAGUIÉ");
  for(let i=1;i<9;i++) rows += `<c r="${COL[i]}2" s="2"/>`; rows += `</row>`;
  // r5 section
  rows += `<row r="5">`+_cell("A5",3,"s","DÉTAIL DE TOUS LES DÉCAISSEMENTS")+`</row>`;
  // r6 entête
  const heads=["N°","Désignation","Fournisseur / Bénéficiaire","Date","Montant","Nature","Imputation","Mois","Observation"];
  rows += `<row r="6">`+heads.map((h,i)=>_cell(COL[i]+"6",4,"s",h)).join("")+`</row>`;
  // données
  lignes.forEach((l,k)=>{
    const r=7+k;
    rows += `<row r="${r}">`+
      _cell("A"+r,5,"n",l.num)+
      _cell("B"+r,6,"s",l.designation)+
      _cell("C"+r,5,"s",l.acteur)+
      (l.dateISO ? _cell("D"+r,8,"n",_serieDate(l.dateISO)) : _cell("D"+r,5,"s",""))+
      _cell("E"+r,7,"n",Math.round(l.montant||0))+
      _cell("F"+r,5,"s",l.nature)+
      _cell("G"+r,9,"s",l.imputation)+
      _cell("H"+r,5,"s",l.mois||"")+
      _cell("I"+r,6,"s",l.observation||"")+
    `</row>`;
  });
  const dim = "A1:I"+(6+lignes.length);
  const cols = '<cols>'+
    '<col min="1" max="1" width="7.4" customWidth="1"/>'+
    '<col min="2" max="3" width="33.3" customWidth="1"/>'+
    '<col min="4" max="4" width="14.8" customWidth="1"/>'+
    '<col min="5" max="5" width="20.3" customWidth="1"/>'+
    '<col min="6" max="6" width="16.7" customWidth="1"/>'+
    '<col min="7" max="8" width="14.8" customWidth="1"/>'+
    '<col min="9" max="9" width="37" customWidth="1"/></cols>';
  const sheet = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    `<dimension ref="${dim}"/><sheetViews><sheetView workbookViewId="0"><pane ySplit="6" topLeftCell="A7" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>`+
    '<sheetFormatPr defaultRowHeight="15"/>'+cols+
    `<sheetData>${rows}</sheetData>`+
    `<mergeCells count="${merge.length}">`+merge.map(m=>`<mergeCell ref="${m}"/>`).join("")+`</mergeCells>`+
    '</worksheet>';
  return _zip([
    {name:"[Content_Types].xml", data:_utf8(CT)},
    {name:"_rels/.rels", data:_utf8(RELS)},
    {name:"xl/workbook.xml", data:_utf8(WB)},
    {name:"xl/_rels/workbook.xml.rels", data:_utf8(WBRELS)},
    {name:"xl/styles.xml", data:_utf8(STYLES)},
    {name:"xl/worksheets/sheet1.xml", data:_utf8(sheet)},
  ]);
}

function telechargerBin(nom, bytes, type){
  const b = new Blob([bytes], {type});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = nom; a.click();
  URL.revokeObjectURL(a.href);
}
function moisLabel(iso){
  if(!iso) return "";
  const base = (meta("moisZero","2026-05")).split("-").map(Number);
  const p = iso.split("-").map(Number);
  return "Mois " + ((p[0]-base[0])*12 + (p[1]-base[1]));
}
function lignesDecaissement(){
  const rows = [];
  ETAT.demandes.forEach(d => (d.reglements||[]).forEach(r => rows.push({d, r})));
  rows.sort((a,b) => String(a.r.date||"").localeCompare(String(b.r.date||"")));
  return rows.map((x,i) => ({
    num: i+1, designation: x.d.objet, acteur: x.d.beneficiaire, dateISO: x.r.date,
    montant: x.r.montant, nature: x.r.mode, imputation: x.d.imputation,
    mois: moisLabel(x.r.date), observation: x.r.obs || x.d.obs || ""
  }));
}
function exporterDecaissementsXlsx(){
  const lignes = lignesDecaissement();
  if(!lignes.length){ alert("Aucun décaissement enregistré à exporter."); return; }
  const bytes = construireXlsx(lignes);
  telechargerBin("Decaissements-Azaguie-"+auj()+".xlsx", bytes,
    "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
}

/* ============================================================
   SYNCHRONISATION GOOGLE SHEET (Phase 2)
   ============================================================ */
const URL_DEFAUT = "https://script.google.com/macros/s/AKfycbw5ru2iHaPndQLtp7bUl7X5KMEi6-tL49iR3TtlnWxuc-5bcBJCwLy44lePIwMdLTab/exec";
let CONNEX = null;
try { CONNEX = JSON.parse(localStorage.getItem("siyo_connexion_azaguie")||"null"); } catch(e){}
let PENDING = [];
try { PENDING = JSON.parse(localStorage.getItem("siyo_pending_azaguie")||"[]"); } catch(e){}
let syncEtat = "local", syncHeure = null, flushEnCours = false;
function sauverPending(){ try{ localStorage.setItem("siyo_pending_azaguie", JSON.stringify(PENDING)); }catch(e){} }
function majEtatSync(msg){
  const el = document.getElementById("etat-sync"); if(!el) return;
  if(!CONNEX){ el.textContent = "● Local seulement"; el.style.color = "#ffd777"; el.title = "Non connecté au Google Sheet — voir Paramètres"; return; }
  if(syncEtat==="busy"){ el.textContent = "● Synchronisation…"; el.style.color = "#9ecbff"; }
  else if(syncEtat==="ok" && !PENDING.length){ el.textContent = "● Connecté"+(syncHeure?" · "+syncHeure:""); el.style.color = "#7ee2a8"; el.title = "Synchronisé avec le Google Sheet"; }
  else { el.textContent = "● Hors ligne — "+PENDING.length+" en attente"; el.style.color = "#ff9d9d"; el.title = msg||"Modifications en attente — bouton Synchroniser dès que la connexion revient"; }
}
function apiGet(){ return fetch(CONNEX.url+"?token="+encodeURIComponent(CONNEX.token)).then(r=>r.json()); }
function apiPost(corps){ corps.token = CONNEX.token; return fetch(CONNEX.url, {method:"POST", body: JSON.stringify(corps)}).then(r=>r.json()); }
function enrichir(d){ const c = JSON.parse(JSON.stringify(d)); c._montantDemande = montantDemande(d); c._totalPaye = totalPaye(d); return c; }
function pushOp(op){
  if(!CONNEX) return;
  PENDING = PENDING.filter(p=>!(p.type===op.type && String(p.id)===String(op.id)));
  PENDING.push(op); sauverPending(); flush();
}
async function flush(){
  if(!CONNEX || flushEnCours || !PENDING.length){ majEtatSync(); return; }
  flushEnCours = true; syncEtat = "busy"; majEtatSync();
  try{
    while(PENDING.length){
      const op = PENDING[0];
      let rep = null;
      if(op.type==="demande"){
        const d = parId(op.id);
        if(!d){ PENDING.shift(); sauverPending(); continue; }
        rep = await apiPost({action:"saveDemande", demande:enrichir(d), baseUpdatedAt:d.updatedAt||""});
        if(rep && rep.ok){ d.updatedAt = rep.updatedAt; if(rep.num && rep.num!==d.num) d.num = rep.num; sauverLocal(); }
      } else if(op.type==="delete"){
        rep = await apiPost({action:"deleteDemande", id:op.id});
      } else if(op.type==="params"){
        rep = await apiPost({action:"saveParams", params:{meta:ETAT.meta, postes:ETAT.postes, axes:ETAT.axes}});
      } else if(op.type==="all"){
        rep = await apiPost({action:"saveAll", params:{meta:ETAT.meta, postes:ETAT.postes, axes:ETAT.axes}, demandes:ETAT.demandes.map(enrichir)});
      }
      if(rep && rep.conflit){
        PENDING.shift(); sauverPending();
        alert("⚠ "+rep.erreur+"\nLes données vont être rechargées depuis le Google Sheet.");
        flushEnCours = false;
        await tirer(); return;
      }
      if(!rep || rep.ok===false) throw new Error((rep && rep.erreur) || "pas de réponse");
      PENDING.shift(); sauverPending();
    }
    syncEtat = "ok"; syncHeure = new Date().toTimeString().slice(0,5);
  } catch(e){ syncEtat = "offline"; }
  flushEnCours = false; majEtatSync();
}
async function tirer(){
  if(!CONNEX){ alert("Pas encore connecté : Paramètres → Connexion Google Sheet."); return false; }
  syncEtat = "busy"; majEtatSync();
  try{
    const rep = await apiGet();
    if(!rep.ok) throw new Error(rep.erreur||"réponse invalide");
    if(rep.params && rep.params.meta){ ETAT.meta = rep.params.meta; if(rep.params.postes) ETAT.postes = rep.params.postes; if(rep.params.axes) ETAT.axes = rep.params.axes; }
    if(rep.demandes && rep.demandes.length) ETAT.demandes = rep.demandes;
    sauverLocal(); voir(vueActive);
    syncEtat = "ok"; syncHeure = new Date().toTimeString().slice(0,5); majEtatSync();
    return true;
  } catch(e){ syncEtat = "offline"; majEtatSync(String(e.message||e)); return false; }
}
async function synchroniser(){
  if(!CONNEX){ alert("Pas encore connecté : Paramètres → Connexion Google Sheet."); voir("params"); return; }
  await flush();
  if(!PENDING.length) await tirer();
}
async function connecter(){
  const url = document.getElementById("cx-url").value.trim() || URL_DEFAUT;
  const token = document.getElementById("cx-token").value.trim();
  if(!url || !token){ alert("URL et clé d'accès obligatoires."); return; }
  try{
    const r = await fetch(url+"?token="+encodeURIComponent(token)).then(x=>x.json());
    if(!r.ok) throw new Error(r.erreur||"accès refusé");
    CONNEX = {url, token};
    try{ localStorage.setItem("siyo_connexion_azaguie", JSON.stringify(CONNEX)); }catch(e){}
    const n = r.demandes ? r.demandes.length : 0;
    if(n > 0){
      if(confirm(`Connexion réussie — ${n} demande(s) sur le Sheet.\nCharger le contenu du Sheet dans l'appli ?`)) await tirer();
    } else if(ETAT.demandes.length){
      if(confirm(`Connexion réussie — le Sheet est vide.\nEnvoyer les ${ETAT.demandes.length} demandes locales vers le Sheet (1ère mise en service) ?`)) pushOp({type:"all", id:"all"});
    } else { alert("Connexion réussie."); }
    syncEtat = "ok"; syncHeure = new Date().toTimeString().slice(0,5);
    majEtatSync(); voir("params");
  }catch(e){
    alert("Échec de connexion : "+(e.message||e)+"\nVérifie : URL complète (…/exec), clé identique à celle du script, déploiement « Tout le monde ».");
  }
}
function deconnecter(){
  if(confirm("Se déconnecter du Google Sheet ? Les données locales restent sur ce poste.")){
    CONNEX = null; localStorage.removeItem("siyo_connexion_azaguie");
    majEtatSync(); voir("params");
  }
}
function migrerVersSheet(){
  if(!CONNEX){ alert("Connecte d'abord (bouton « Connecter / Tester »)."); return; }
  if(confirm("Envoyer TOUTES les données locales vers le Sheet ? Le contenu actuel du Sheet sera remplacé.")) pushOp({type:"all", id:"all"});
}

/* démarrage */
voir("bord");
majEtatSync();
(async ()=>{ if(CONNEX){ if(PENDING.length) await flush(); if(!PENDING.length) await tirer(); } })();
</script>
